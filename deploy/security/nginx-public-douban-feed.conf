# Nginx reference snippet for the existing werss.wiblog.cn HTTPS vhost.
# Add in the Nginx `http {}` context, alongside its other rate-limit zones:
#   limit_req_zone $binary_remote_addr zone=werss_public_feed:10m rate=10r/m;
#
# Add this location inside the HTTPS server with `server_name werss.wiblog.cn`.
# All other paths, including the application UI and API, retain their
# existing auth/deny policies.
location = /feed/MP_WXS_2391391020.xml {
    auth_basic off;
    limit_except GET { deny all; }
    limit_req zone=werss_public_feed burst=10 nodelay;
    limit_req_status 429;
    proxy_pass http://we-mp-rss:8001/feed/MP_WXS_2391391020.xml?is_update=true;
    proxy_method GET;
    proxy_hide_header Content-Type;
    add_header Content-Type "application/rss+xml; charset=utf-8" always;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Authorization "";
    proxy_read_timeout 20s;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "public, max-age=300" always;
}
