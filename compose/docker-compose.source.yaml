# Source-built WeRSS deployment; expose only through the authenticated HTTPS proxy.
services:
  we-mp-rss:
    image: local/we-mp-rss:source-9fd4edb-hardened-errors
    build:
      context: ..
      dockerfile: deploy/security/Dockerfile
    restart: "no"
    ports:
      - "127.0.0.1:18001:8001"
    environment:
      USERNAME: admin
      PASSWORD: ${WE_RSS_ADMIN_PASSWORD:?set a unique strong admin password}
      SECRET_KEY: ${WE_RSS_SECRET_KEY:?set a unique random secret key}
      DB: sqlite:///./data/we_mp_rss.db
      REDIS_SERVER_ENABLED: "False"
      REDIS_URL: ""
      AUTO_RELOAD: "False"
      # Keep scheduled polling disabled until WeRead QR auth has been verified.
      ENABLE_JOB: "False"
      # Public-account backend endpoints now frequently return 200013 (rate limit).
      # WeRead provides a low-frequency latest-article incremental alternative.
      GATHER.MODEL: weread_mp
      GATHER.CONTENT: "True"
      GATHER.CONTENT_AUTO_CHECK: "False"
      WEREAD_CONTENT_INTERVAL: "2"
      # This feed is already on the WeRead shelf; skip shelf sync on each poll.
      WEREAD_AUTO_ADD_TO_SHELF: "false"
      # Bound optional daily backfill list probing to 3 pages.
      WEREAD_MP_MAX_PAGES: "3"
      RSS_FULL_CONTEXT: "True"
      RSS_FULLTEXT_ONLY: "True"
      RSS_ADD_COVER: "True"
      RSS_BASE_URL: https://werss.wiblog.cn/
      HEADLESS: "true"
      TZ: Asia/Shanghai
      CORS_ALLOWED_ORIGINS: ""
    volumes:
      - we_mprss_data:/app/data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 1g
    cpus: 1.0
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
volumes:
  we_mprss_data:
